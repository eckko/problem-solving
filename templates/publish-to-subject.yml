# Copy this file into a PRIVATE book repo as
#   .github/workflows/publish-to-subject.yml
# and set SUBJECT_REPO. It publishes only index.html, questions.json,
# images/favicon.png and media/ into the subject site's folder for this
# book. Nothing else in the book repo is read.
#
# One-time setup:
#   1. Create a fine-grained personal access token for the subject repo
#      only, with "Contents: Read and write".
#   2. Save it in this book repo (or once for the account) as the secret
#      SUBJECT_REPO_TOKEN.
name: Publish to subject site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - questions.json
      - images/favicon.png
      - media/**
      - .github/workflows/publish-to-subject.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-to-subject
  cancel-in-progress: false

env:
  SUBJECT_REPO: YOUR_USER/YOUR_SUBJECT_REPO
  # The folder (and URL name) of the book: lower-case letters, digits, dashes.
  BOOK_FOLDER: ${{ github.event.repository.name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this book repo
        uses: actions/checkout@v4
        with:
          path: book

      - name: Check out the subject site
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPO }}
          token: ${{ secrets.SUBJECT_REPO_TOKEN }}
          path: subject

      - name: Publish
        run: subject/tools/publish_book.sh "$PWD/book" "$BOOK_FOLDER"
